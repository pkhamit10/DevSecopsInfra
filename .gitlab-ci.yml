#       when: manual
#   environment:
#     name: dev

destroy:
  stage: destroy
  variables:
    TF_VAR_aws_profile: ""
  script:
    - cd "$TF_ROOT"
    - terraform init -input=false
    - terraform destroy -input=false -auto-approve
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: dev
